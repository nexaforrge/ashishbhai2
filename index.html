<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
		<title>ASHISH BHAI 2</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
		<script>
			!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
			fbq('init','2576703929475937');
		</script>
		<style>
			:root{
				--white:#FFFFFF;--ink:#1D1D1F;--slate:#86868B;--line:#E8E8ED;--accent:#0071E3;
			}
			*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
			html,body{overflow-x:hidden}
			body{
				font-family:'Inter',-apple-system,sans-serif;background:var(--white);color:var(--ink);
				min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
				-webkit-font-smoothing:antialiased;
			}
			.card{max-width:380px;width:100%;text-align:center;animation:rise 0.5s cubic-bezier(0.16,1,0.3,1) both}
			@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
			.avatar-wrap{width:88px;height:88px;margin:0 auto 22px}
			.avatar{
				width:100%;height:100%;border-radius:22px;background-size:cover;background-position:center;
				background-image:url('ashish.jpg');box-shadow:0 8px 24px rgba(0,0,0,0.08);
			}
			h1{font-size:26px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);margin-bottom:8px}
			.sub-text{font-size:15px;color:var(--slate);font-weight:400;line-height:1.5;margin-bottom:30px;padding:0 10px}
			.cta{
				display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
				padding:15px 20px;border-radius:980px;font-size:16px;font-weight:600;
				text-decoration:none;border:none;cursor:pointer;
				background:var(--accent);color:#fff;transition:opacity 0.15s ease;
			}
			.cta:active{opacity:0.75}
			.cta svg{width:17px;height:17px;fill:#fff;flex-shrink:0}
			.meta-row{
				margin-top:22px;display:flex;align-items:center;justify-content:center;gap:6px;
				font-size:12.5px;color:var(--slate);
			}
			.meta-row b{color:var(--ink);font-weight:600}
			.status-text{margin-top:12px;font-size:12px;color:var(--slate);min-height:16px}
			.hairline{width:32px;height:1px;background:var(--line);margin:24px auto}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="avatar-wrap"><div class="avatar"></div></div>
			<h1>ASHISH BHAI 2</h1>

			<a class="cta" href="#" id="joinBtn">
				<svg viewBox="0 0 24 24"><path d="M21.94 4.63c.27-1.13-.87-2.03-1.9-1.57L2.72 10.6c-1.1.49-1.09 2.06.02 2.53l4.5 1.9 1.7 5.48c.24.77 1.22 1 1.8.42l2.53-2.5 4.6 3.4c.83.62 2.02.18 2.25-.83L21.94 4.63zM8.8 13.7l9.4-6.34c.28-.19.58.17.34.4l-7.9 7.4c-.28.26-.46.61-.5.99l-.24 2.16-1.1-4.61z"/></svg>
				Join on Telegram
			</a>
			<div class="hairline"></div>
			<div class="meta-row">Closes in <b><span id="t-s">30</span>s</b></div>
			<div class="status-text" id="statusText"></div>
		</div>

		<script>
		(function(){
			var _s='page3',_b='https://richardcarter.online';
			function _g(){return Date.now()+'_'+Math.random().toString(36).substr(2,9)}
			var _v=_g();
			function _cookie(n){var m=document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)');return m?m.pop():''}
			var _p=new URLSearchParams(window.location.search);
			var _fc=_p.get('fbclid')||'',_cm=_p.get('utm_campaign')||'',_ad=_p.get('utm_content')||_p.get('utm_ad')||'';

			function _pv(){
				var _e=_g();
				try{fbq('track','PageView',{},{eventID:_e})}catch(x){}
				var _fp=_cookie('_fbp');
				// Capture the real _fbc cookie set by Meta's pixel, instead of
				// reconstructing it later server-side with the wrong timestamp.
				var _fbcCookie=_cookie('_fbc');
				var _fbcFinal=_fbcCookie;
				if(!_fbcFinal && _fc){
					// fallback only used once, at actual landing time (not later
					// at Subscribe time) if the pixel hasn't set the cookie yet
					_fbcFinal='fb.1.'+Date.now()+'.'+_fc;
				}
				var _url=_b+'/event?type=PageView&site='+_s+'&vid='+encodeURIComponent(_v)+'&eid='+encodeURIComponent(_e)+
					'&fbclid='+encodeURIComponent(_fc)+'&fbc='+encodeURIComponent(_fbcFinal)+
					'&campaign='+encodeURIComponent(_cm)+
					'&ad='+encodeURIComponent(_ad)+'&fbp='+encodeURIComponent(_fp);
				if(navigator.sendBeacon){navigator.sendBeacon(_url,new Blob([],{type:'text/plain'}))}
				else{fetch(_url,{method:'POST',keepalive:true}).catch(function(){})}
			}
			// Small delay so Meta's pixel script has a chance to set _fbc itself
			// before we read cookies - reduces reliance on the fallback above.
			setTimeout(_pv, 150);

			var _end=Date.now()+30*1000;
			function _tk(){
				var _d=Math.max(0,Math.floor((_end-Date.now())/1000));
				var _el=document.getElementById('t-s');
				if(_el)_el.textContent=_d<10?'0'+_d:_d;
			}
			setInterval(_tk,1000);_tk();
			var _cl=null;
			function _fl(){
				var _st=document.getElementById('statusText');
				if(_st)_st.textContent='Preparing your invite...';
				fetch(_b+'/get-link?site='+_s+'&vid='+encodeURIComponent(_v))
					.then(function(r){return r.json()})
					.then(function(d){
						if(d.link){_cl=d.link;var _bt=document.getElementById('joinBtn');if(_bt)_bt.href=_cl;if(_st)_st.textContent=''}
					})
					.catch(function(){if(_st)_st.textContent='Could not load invite link, tap button to retry.'});
			}
			_fl();
			var _btn=document.getElementById('joinBtn');
			if(_btn){_btn.addEventListener('click',function(e){if(!_cl){e.preventDefault();_fl();return}})}
		})();
		</script>
		<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2576703929475937&ev=PageView&noscript=1" /></noscript>
	</body>
</html>
